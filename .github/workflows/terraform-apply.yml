name: Terraform Apply

on:
  # El ambiente esta actualmente destruido (ver CLAUDE.md "Current status
  # (2026-09-29)") - no hay certificado que renovar, y desde el fix de
  # identidades persistentes (ver "Identidades de CI en state propio") un
  # apply disparado por cron SI lograria autenticarse y recrearia todo el
  # proyecto desde cero como efecto secundario, no solo fallar de forma
  # segura como antes. Triggers automaticos (push a main, schedule semanal
  # para la renovacion de Let's Encrypt via acme_certificate - ver acme.tf)
  # quedan desactivados a proposito. Restaurar ambos al redesplegar, pensando
  # primero si el schedule semanal es realmente lo que se quiere reactivar:
  #   push:
  #     branches: [main]
  #     paths:
  #       - "*.tf"
  #       - ".github/workflows/terraform-apply.yml"
  #   schedule:
  #     - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  id-token: write # requerido para autenticar contra Azure vía OIDC
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false # nunca cancelar un apply en curso

env:
  # STALE - containerapps-agent identity was destroyed with the teardown;
  # replace ARM_CLIENT_ID_AGENT after redeploying. Values below all come
  # from repo variables (Settings -> Secrets and variables -> Actions ->
  # Variables) rather than being hardcoded here -- moved out 2026-09 during
  # a security review, since this file is public.
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_AGENT }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID }}
  TF_VAR_acme_email: ${{ secrets.ACME_EMAIL }}
  TF_VAR_network_containerapps_subnet_id: ${{ vars.NETWORK_CONTAINERAPPS_SUBNET_ID }}
  TF_VAR_network_appgw_subnet_id: ${{ vars.NETWORK_APPGW_SUBNET_ID }}
  TF_VAR_network_vnet_id: ${{ vars.NETWORK_VNET_ID }}
  TF_VAR_network_log_analytics_workspace_id: ${{ vars.NETWORK_LOG_ANALYTICS_WORKSPACE_ID }}
  ARM_USE_OIDC: true

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ver el comentario equivalente en terraform-plan.yml: necesario para
      # que el provider "acme" (challenge DNS-01) autentique - no comparte
      # la resolución OIDC interna de azurerm.
      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
